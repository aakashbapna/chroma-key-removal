<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green to transparent</title>
<style>[hidden]{display:none!important}body{font:16px system-ui;background:#151b21;color:#e6edf3;max-width:1000px;margin:50px auto;padding:20px}h1{font-size:38px}button,input,a{font:inherit;margin:12px 8px 12px 0}button,a{background:#9aefb7;color:#102218;border:0;padding:12px 18px;border-radius:8px}canvas{max-width:100%;background:repeating-conic-gradient(#bbb 0% 25%,#eee 0% 50%) 50%/24px 24px}#status{min-height:30px;color:#b9c8d2}a{display:inline-block}small{display:block;line-height:1.6;color:#b9c8d2}</style>
<h1>Green to transparent</h1><p>Remove a bright green backdrop and download a transparent PNG.</p>
<input id="file" type="file" accept="image/*" disabled><button id="example" disabled>Try example</button><a id="download" hidden download="transparent.png">Download PNG</a>
<p id="status">Loading local model…</p><canvas id="output"></canvas><small>Processing stays in your browser. First load downloads the TensorFlow runtime from a CDN. Genuine green artwork can also become transparent.</small>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>
<script>
const status=document.getElementById('status'),file=document.getElementById('file'),example=document.getElementById('example'),download=document.getElementById('download'),canvas=document.getElementById('output');
const version=new URLSearchParams(location.search).get('model') || 'banner';
const useBanner=version==='banner',useV2=version==='v2',useV3=version==='v3'||useBanner;
const TILE=useV3?256:useV2?160:128, HALO=useV3?64:useV2?12:4, STRIDE=TILE-2*HALO;
let model,downloadURL;
function busy(value){file.disabled=value;example.disabled=value;}
async function run(url){
 busy(true);download.hidden=true;
 try {
 const im=new Image();im.src=url;await im.decode();const w=im.naturalWidth,h=im.naturalHeight;
 if(w*h>16000000)throw Error('Please use an image under 16 megapixels.');
 canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(im,0,0);const source=ctx.getImageData(0,0,w,h),result=ctx.createImageData(w,h);
 let done=0,total=Math.ceil(w/STRIDE)*Math.ceil(h/STRIDE);
 for(let y=0;y<h;y+=STRIDE)for(let x=0;x<w;x+=STRIDE){
  const tile=new Float32Array(TILE*TILE*3);
  for(let ty=0;ty<TILE;ty++)for(let tx=0;tx<TILE;tx++){
   const sy=Math.max(0,Math.min(h-1,y+ty-HALO)),sx=Math.max(0,Math.min(w-1,x+tx-HALO)),si=(sy*w+sx)*4,ti=(ty*TILE+tx)*3;
   for(let c=0;c<3;c++)tile[ti+c]=source.data[si+c]/255;
  }
  const input=tf.tensor4d(tile,[1,TILE,TILE,3]);let prediction;
  try {
   prediction=model.predict(input);const alpha=await prediction.data();
   for(let dy=0;dy<Math.min(STRIDE,h-y);dy++)for(let dx=0;dx<Math.min(STRIDE,w-x);dx++){
    let a=alpha[(dy+HALO)*TILE+dx+HALO];a=a<.01?0:a>.99?1:a;const i=((y+dy)*w+x+dx)*4;
    for(let c=0;c<3;c++){const v=(source.data[i+c]/255-(c===1?1-a:0))/Math.max(a,.03);result.data[i+c]=a===0?0:Math.round(Math.max(0,Math.min(1,v))*255);}
    result.data[i+3]=Math.round(a*255);
   }
  }finally{input.dispose();if(prediction)prediction.dispose();}
  status.textContent=`Processing ${++done} / ${total} tiles`;await new Promise(requestAnimationFrame);
 }
 ctx.putImageData(result,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
 if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(blob);download.href=downloadURL;download.hidden=false;status.textContent=`Done — ${w} × ${h} transparent PNG`;
 }catch(e){status.textContent='Could not process image: '+e.message;console.error(e);}finally{busy(false);}
}
file.onchange=async()=>{if(!file.files[0])return;const u=URL.createObjectURL(file.files[0]);try{await run(u);}finally{URL.revokeObjectURL(u);}};
example.onclick=()=>run(useBanner?'../examples/banner_input.jpg':useV3?'../examples/v3/demo_input.png':useV2?'../examples/v2/demo_input.png':'../examples/input_0.png');
(async()=>{try{await tf.setBackend('cpu');await tf.ready();tflite.setWasmPath('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/');model=await tflite.loadTFLiteModel(useBanner?'../models/banner_latest/product_chroma.tflite':useV3?'../models/v3/product_chroma.tflite':useV2?'../models/v2/product_chroma.tflite':'../models/chroma_matte.tflite',{numThreads:1});status.textContent=(useBanner?'Retrained banner model ready':useV3?'V3 refinement model ready':useV2?'Larger product model ready':'Original model ready')+' — choose your banner';busy(false);}catch(e){status.textContent='Model loading failed: '+e.message;console.error(e);}})();
</script></html>
