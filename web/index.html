<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green to transparent</title>
<style>[hidden]{display:none!important}body{font:16px system-ui;background:#151b21;color:#e6edf3;max-width:1050px;margin:45px auto;padding:20px}h1{font-size:38px}button,input,a{font:inherit;margin:10px 8px 10px 0}button,a{background:#9aefb7;color:#102218;border:0;padding:12px 18px;border-radius:8px}canvas{max-width:100%;background:repeating-conic-gradient(#bbb 0% 25%,#eee 25% 50%) 50%/24px 24px}#status{min-height:30px;color:#b9c8d2}a{display:inline-block}small{display:block;line-height:1.6;color:#b9c8d2}</style>
<h1>Green to transparent</h1><p>Keep the artwork. Remove the green background.</p>
<input id="file" type="file" accept="image/*"><button id="example">Try example</button><a id="download" hidden download="transparent.png">Download PNG</a>
<p id="status">Choose your banner. Banners without a green background stay intact.</p><canvas id="output"></canvas><small>Processing stays in your browser. Genuine green artwork on a green backdrop may also be removed.</small>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>
<script type="module">
import {inspect,refine} from './chroma.js';
const status=document.getElementById('status'),file=document.getElementById('file'),example=document.getElementById('example'),download=document.getElementById('download'),canvas=document.getElementById('output');let model,downloadURL;
function busy(v){file.disabled=v;example.disabled=v;}
async function loadModel(){if(model)return model;await tf.setBackend('cpu');await tf.ready();tflite.setWasmPath('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/');model=await tflite.loadTFLiteModel('../models/banner_latest/product_chroma.tflite',{numThreads:1});return model;}
async function run(url){busy(true);download.hidden=true;try{const im=new Image();im.src=url;await im.decode();const w=im.naturalWidth,h=im.naturalHeight;if(w*h>16000000)throw Error('Please use an image under 16 megapixels.');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(im,0,0);const source=ctx.getImageData(0,0,w,h),info=inspect(source.data,w,h);let result=ctx.createImageData(w,h);
 if(info.preserve){result.data.set(source.data);}else if(info.uniform){status.textContent='Cleaning the background and edges…';await new Promise(requestAnimationFrame);result.data.set(refine(source.data,w,h));}else{status.textContent='Loading model…';await loadModel();let done=0,total=Math.ceil(w/128)*Math.ceil(h/128);for(let y=0;y<h;y+=128)for(let x=0;x<w;x+=128){const tile=new Float32Array(256*256*3);for(let ty=0;ty<256;ty++)for(let tx=0;tx<256;tx++){const sy=Math.max(0,Math.min(h-1,y+ty-64)),sx=Math.max(0,Math.min(w-1,x+tx-64)),si=(sy*w+sx)*4,ti=(ty*256+tx)*3;for(let c=0;c<3;c++)tile[ti+c]=source.data[si+c]/255;}const input=tf.tensor4d(tile,[1,256,256,3]);let prediction;try{prediction=model.predict(input);const alpha=await prediction.data();for(let dy=0;dy<Math.min(128,h-y);dy++)for(let dx=0;dx<Math.min(128,w-x);dx++){let a=alpha[(dy+64)*256+dx+64];a=a<.01?0:a>.99?1:a;const i=((y+dy)*w+x+dx)*4;for(let c=0;c<3;c++){const v=(source.data[i+c]/255-(c===1?1-a:0))/Math.max(a,.03);result.data[i+c]=a===0?0:Math.round(Math.max(0,Math.min(1,v))*255);}result.data[i+3]=Math.round(a*255);}}finally{input.dispose();if(prediction)prediction.dispose();}status.textContent=`Processing ${++done} / ${total} tiles`;await new Promise(requestAnimationFrame);}}
 ctx.putImageData(result,0,0);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(downloadURL)URL.revokeObjectURL(downloadURL);downloadURL=URL.createObjectURL(blob);download.href=downloadURL;download.hidden=false;status.textContent=info.preserve?`Preserved intact — ${w} × ${h} PNG`:`Done — ${w} × ${h} transparent PNG`;
 }catch(e){status.textContent='Could not process image: '+e.message;console.error(e);}finally{busy(false);}}
file.onchange=async()=>{if(!file.files[0])return;const u=URL.createObjectURL(file.files[0]);try{await run(u);}finally{URL.revokeObjectURL(u);}};example.onclick=()=>run('../examples/banner_input.jpg');
</script></html>
